# LLaVA-1.5-7B: locked operating point of the paper (Sec. 5.1).

model:
  hf_id: llava-hf/llava-1.5-7b-hf
  dtype: float16
  attn_implementation: eager

direction:
  file: outputs/llava15_7b/direction.pt   # written by scripts/compute_direction.py

steering:
  layer: 30                # selected by Eq. 9 over layer_candidates
  layer_candidates: [27, 28, 29, 30, 31]
  alpha: 1.1
  depth_alpha: 1.1         # strength held fixed during depth selection
  k: 0.8                   # threshold quantile (Eq. 5)
  k_matched: 0.45          # static control matched in firing rate to EGDR
  w_tau: 0.5               # entropy modulation weight (Eq. 7)

calibration:
  pool: data/calibration/pool.json   # 100 COCO train2014 images, 500 existence queries
  seed: 42
  replicates: 10           # development panels: pools with seeds 42..51 (replicate 0 = pool)
  alpha_grid: [0.3, 0.6, 1.1, 1.6]
  w_tau_grid: [0.25, 0.5, 1.0]

evaluation:
  pope_max_new_tokens: 10      # existence-query answers
  chair_prompt: Please describe this image in detail.   # captions for strength selection and the demo
  chair_max_new_tokens: 512
  batch_size: 16
  caption_batch_size: 8

paths:
  coco_root: data/coco
  output_dir: outputs/llava15_7b
